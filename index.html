<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Initial Calculator Screen -->
  <div id="calculator-screen" class="screen active">
    <div class="header">
      <h1>Vacation Calculator</h1>
    </div>
    <div class="input-section">
      <div class="input-group">
        <label for="nights-per-year">How many nights per year do you stay in vacation accommodations?</label>
        <div class="slider-row">
          <input type="range" id="nights-per-year" min="0" max="50" value="0" oninput="updateValue('nights-value', this.value)">
          <span id="nights-value">0</span>
        </div>
      </div>
      <div class="input-group">
        <label for="cost-per-night">What is the average cost per night?</label>
        <div class="slider-row">
          <input type="range" id="cost-per-night" min="0" max="500" step="10" value="0" oninput="updateValue('cost-value', this.value)">
          <span id="cost-value">$0</span>
        </div>
      </div>
      <div class="input-group">
        <label for="years-planning">How many years do you plan to vacation?</label>
        <div class="slider-row">
          <input type="range" id="years-planning" min="0" max="60" value="0" oninput="updateValue('years-value', this.value)">
          <span id="years-value">0</span>
        </div>
      </div>
      <div class="input-group">
        <label for="inflation-rate">Inflation Rate (%)</label>
        <input type="number" id="inflation-rate" value="0" step="0.01">
      </div>
    </div>
    <div class="button-section">
      <button class="calculate-button" onclick="calculate()">Calculate</button>
      <button class="reset-button" onclick="reset()">Reset</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen hidden">
    <div class="header">
      <h1>Vacation Calculator</h1>
    </div>
    <div class="result-summary">
      <div class="summary-row"><strong>Nights per year in a hotel:</strong> <span id="summary-nights">0</span></div>
      <div class="summary-row"><strong>Average cost per night:</strong> $<span id="summary-cost">0</span></div>
      <div class="summary-row"><strong>Years planning to continue:</strong> <span id="summary-years">0</span></div>
      <div class="summary-row"><strong>Inflation rate:</strong> <span id="summary-inflation">0.00%</span></div>
    </div>
    <div class="comparison-section">
      <div class="comparison-item">
        <div class="circle red">
          <p>Total Hotel Cost</p>
          <p id="hotel-cost-circle">$0</p>
        </div>
        <img src="hotel-room.png" alt="Hotel Room" class="comparison-image hotel-image">
      </div>
      <div class="comparison-text">
        <p>If the cost was the same, which would you choose?</p>
      </div>
      <div class="comparison-item">
        <p class="vacation-ownership-title">Vacation Ownership</p>
        <img src="vacation-condo.png" alt="Vacation Condo" class="comparison-image condo-image">
      </div>
    </div>
    <button class="back-button" onclick="goBack()">Back</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
