<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Initial Calculator Screen -->
  <div id="calculator-screen" class="screen active">
    <h1>Vacation Cost Calculator</h1>

    <!-- Input: Nights per year -->
    <div class="input-group">
      <label for="nights-per-year">How many nights per year do you stay in vacation accommodations?</label>
      <input type="range" id="nights-per-year" min="0" max="50" value="0" oninput="updateValue('nights-value', this.value)">
      <span id="nights-value">0</span>
    </div>

    <!-- Input: Cost per night -->
    <div class="input-group">
      <label for="cost-per-night">What is the average cost per night?</label>
      <input type="range" id="cost-per-night" min="0" max="500" step="10" value="0" oninput="updateValue('cost-value', this.value)">
      <span id="cost-value">$0</span>
    </div>

    <!-- Input: Years planning to vacation -->
    <div class="input-group">
      <label for="years-planning">How many years do you plan to vacation?</label>
      <input type="range" id="years-planning" min="0" max="60" value="0" oninput="updateValue('years-value', this.value)">
      <span id="years-value">0</span>
    </div>

    <!-- Input: Inflation rate -->
    <div class="input-group">
      <label for="inflation-rate">Inflation Rate (%)</label>
      <input type="number" id="inflation-rate" value="0" step="0.01">
    </div>

    <!-- Buttons -->
    <div class="buttons">
      <button onclick="calculate()">Calculate</button>
      <button onclick="reset()">Reset</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen hidden">
    <h1>Vacation Cost Results</h1>

    <!-- Summary Section -->
    <div class="summary">
      <div class="summary-item"><strong>Nights per year in a hotel:</strong> <span id="summary-nights">0</span></div>
      <div class="summary-item"><strong>Average cost per night:</strong> $<span id="summary-cost">0</span></div>
      <div class="summary-item"><strong>Years planning to continue:</strong> <span id="summary-years">0</span></div>
      <div class="summary-item"><strong>Inflation rate:</strong> <span id="summary-inflation">0.00%</span></div>
    </div>

    <!-- Visual Comparison Section -->
    <div class="comparison-container">
      <!-- Hotel Room -->
      <div class="comparison-item">
        <div class="circle red">
          <p>Total Hotel Cost:</p>
          <p id="hotel-cost-circle">$0</p>
        </div>
        <img src="hotel-room.png" alt="Hotel Room" class="comparison-image">
      </div>

      <!-- Vacation Ownership Condo -->
      <div class="comparison-item">
        <div class="circle blue">
          <p>Vacation Ownership</p>
          <p id="condo-description">Spacious, condo-like accommodations</p>
        </div>
        <img src="vacation-condo.png" alt="Vacation Condo" class="comparison-image">
      </div>
    </div>

    <button class="back-button" onclick="goBack()">Back</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
